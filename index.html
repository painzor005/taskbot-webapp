<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tasks</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #ffffff;
  --bg2: #f1f1f1;
  --text: #000000;
  --hint: #999999;
  --link: #2481cc;
  --btn: #2481cc;
  --btn-text: #ffffff;
  --r: 12px;
  --r-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }

.header { position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 0.5px solid rgba(128,128,128,0.2); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
.header-title { font-size: 17px; font-weight: 600; }
.header-add { width: 32px; height: 32px; border-radius: 50%; background: var(--btn); color: var(--btn-text); border: none; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }

.content { padding: 8px 0; }

.project-block { margin: 4px 16px; background: var(--bg2); border-radius: var(--r); overflow: hidden; }
.project-header { display: flex; align-items: center; padding: 12px 14px; cursor: pointer; gap: 8px; user-select: none; }
.chevron { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; color: var(--hint); flex-shrink: 0; }
.chevron svg { width: 14px; height: 14px; }
.project-block.open .chevron { transform: rotate(90deg); }
.project-name { flex: 1; font-size: 15px; font-weight: 600; }
.project-count { font-size: 12px; color: var(--hint); background: rgba(128,128,128,0.15); padding: 2px 8px; border-radius: 10px; }
.proj-actions { display: flex; gap: 2px; }
.proj-btn { width: 28px; height: 28px; border-radius: 7px; background: none; border: none; color: var(--hint); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.proj-btn:active { background: rgba(128,128,128,0.15); }
.proj-btn.del { color: #ef4444; }

.tasks-list { display: none; border-top: 0.5px solid rgba(128,128,128,0.1); padding: 4px 0; }
.project-block.open .tasks-list { display: block; }

.task-item { display: flex; align-items: center; padding: 10px 14px; gap: 10px; border-bottom: 0.5px solid rgba(128,128,128,0.08); cursor: pointer; }
.task-item:last-of-type { border-bottom: none; }
.task-item:active { background: rgba(128,128,128,0.07); }

.dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.dot.todo { border-color: var(--hint); }
.dot.in_progress { border-color: #f59e0b; background: rgba(245,158,11,0.12); }
.dot.done { border-color: #22c55e; background: #22c55e; }
.dot.done::after { content: ''; width: 6px; height: 4px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translateY(-1px); display: block; }
.dot.cancelled { border-color: #ef4444; }
.dot.cancelled::after { content: '×'; font-size: 13px; color: #ef4444; line-height: 1; font-weight: 600; }

.task-title { flex: 1; font-size: 14px; line-height: 1.4; }
.task-item[data-status="done"] .task-title { text-decoration: line-through; color: var(--hint); }
.task-item[data-status="cancelled"] .task-title { color: var(--hint); opacity: 0.6; }

.task-del { width: 24px; height: 24px; border-radius: 50%; background: none; border: none; color: var(--hint); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; opacity: 0; flex-shrink: 0; }
.task-item:hover .task-del { opacity: 1; }

.add-task-row { display: flex; align-items: center; padding: 9px 14px; gap: 10px; cursor: pointer; color: var(--link); font-size: 14px; }
.add-task-row:active { background: rgba(128,128,128,0.07); }
.add-task-row svg { width: 16px; height: 16px; flex-shrink: 0; }

.empty { text-align: center; padding: 60px 32px; color: var(--hint); }
.empty-icon { font-size: 44px; margin-bottom: 12px; }
.empty-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.empty-sub { font-size: 14px; line-height: 1.5; }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: none; align-items: flex-end; }
.overlay.on { display: flex; }
.sheet { background: var(--bg); border-radius: 16px 16px 0 0; padding: 16px; width: 100%; animation: up 0.22s ease; }
@keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }
.handle { width: 36px; height: 4px; background: rgba(128,128,128,0.25); border-radius: 2px; margin: 0 auto 16px; }
.sheet-title { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 16px; }
.sheet-input { width: 100%; padding: 12px 14px; border-radius: var(--r-sm); background: var(--bg2); border: none; font-size: 15px; color: var(--text); outline: none; margin-bottom: 12px; font-family: inherit; }
.sheet-input::placeholder { color: var(--hint); }
.sheet-btn { width: 100%; padding: 14px; border-radius: var(--r-sm); background: var(--btn); color: var(--btn-text); border: none; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
.sheet-btn:active { opacity: 0.85; }

.status-list { display: flex; flex-direction: column; gap: 4px; }
.status-opt { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-sm); cursor: pointer; background: var(--bg2); border: none; width: 100%; font-family: inherit; font-size: 15px; color: var(--text); text-align: left; }
.status-opt:active { background: rgba(128,128,128,0.15); }
.status-opt.sel { background: rgba(36,129,204,0.1); }
.sdot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid; flex-shrink: 0; }
.sdot.todo { border-color: var(--hint); }
.sdot.in_progress { border-color: #f59e0b; }
.sdot.done { border-color: #22c55e; }
.sdot.cancelled { border-color: #ef4444; }

.loading { display: flex; align-items: center; justify-content: center; height: 200px; }
.spin { width: 28px; height: 28px; border: 3px solid rgba(128,128,128,0.15); border-top-color: var(--btn); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <span class="header-title">Tasks</span>
  <button class="header-add" onclick="openProjSheet()" aria-label="Новый проект">+</button>
</div>

<div class="content" id="content">
  <div class="loading"><div class="spin"></div></div>
</div>

<!-- New project -->
<div class="overlay" id="projSheet" onclick="bgClose(event,'projSheet')">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-title">Новый проект</div>
    <input class="sheet-input" id="projInput" type="text" placeholder="Название проекта" maxlength="60">
    <button class="sheet-btn" onclick="submitProj()">Создать</button>
  </div>
</div>

<!-- New task -->
<div class="overlay" id="taskSheet" onclick="bgClose(event,'taskSheet')">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-title">Новая задача</div>
    <input class="sheet-input" id="taskInput" type="text" placeholder="Что нужно сделать?" maxlength="200">
    <button class="sheet-btn" onclick="submitTask()">Добавить</button>
  </div>
</div>

<!-- Status picker -->
<div class="overlay" id="statusSheet" onclick="bgClose(event,'statusSheet')">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-title">Статус задачи</div>
    <div class="status-list">
      <button class="status-opt" data-s="todo"        onclick="applyStatus('todo')">        <span class="sdot todo"></span>        To do</button>
      <button class="status-opt" data-s="in_progress" onclick="applyStatus('in_progress')"> <span class="sdot in_progress"></span>  In progress</button>
      <button class="status-opt" data-s="done"        onclick="applyStatus('done')">        <span class="sdot done"></span>        Done</button>
      <button class="status-opt" data-s="cancelled"   onclick="applyStatus('cancelled')">   <span class="sdot cancelled"></span>   Cancelled</button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// Apply Telegram theme vars
function applyTheme() {
  if (!tg) return;
  const c = tg.themeParams || {};
  const s = document.documentElement.style;
  if (c.bg_color)            s.setProperty('--bg',       c.bg_color);
  if (c.secondary_bg_color)  s.setProperty('--bg2',      c.secondary_bg_color);
  if (c.text_color)          s.setProperty('--text',     c.text_color);
  if (c.hint_color)          s.setProperty('--hint',     c.hint_color);
  if (c.link_color)          s.setProperty('--link',     c.link_color);
  if (c.button_color)        s.setProperty('--btn',      c.button_color);
  if (c.button_text_color)   s.setProperty('--btn-text', c.button_text_color);
}
applyTheme();

// ─── Storage key based on user_id ───
const uid = new URLSearchParams(location.search).get('user_id')
         || tg?.initDataUnsafe?.user?.id
         || 'demo';
const STORE_KEY = `tasks_v1_${uid}`;

// ─── State ───
let projects = [];     // [{id, name, position, tasks:[{id,title,status}]}]
let openSet  = new Set();
let activeProjId = null;
let activeTaskId = null;
let nextProjId   = 1;
let nextTaskId   = 1;

// ─── Persistence (localStorage via Telegram CloudStorage or fallback) ───
function save() {
  const data = JSON.stringify({ projects, nextProjId, nextTaskId });
  try {
    if (tg?.CloudStorage) {
      tg.CloudStorage.setItem(STORE_KEY, data);
    } else {
      sessionStorage.setItem(STORE_KEY, data);
    }
  } catch(e) {}
}

function loadData(cb) {
  function fromRaw(raw) {
    if (raw) {
      try {
        const d = JSON.parse(raw);
        projects   = d.projects   || [];
        nextProjId = d.nextProjId || (projects.length + 1);
        nextTaskId = d.nextTaskId || 100;
      } catch(e) {}
    }
    cb();
  }

  if (tg?.CloudStorage) {
    tg.CloudStorage.getItem(STORE_KEY, (err, val) => fromRaw(val));
  } else {
    fromRaw(sessionStorage.getItem(STORE_KEY));
  }
}

// ─── Render ───
function render() {
  const el = document.getElementById('content');
  if (!projects.length) {
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">📋</div>
      <div class="empty-title">Нет проектов</div>
      <div class="empty-sub">Нажмите + чтобы создать проект,<br>или напишите задачу боту — AI всё сделает сам</div>
    </div>`;
    return;
  }
  el.innerHTML = projects.map((p,i) => renderProject(p,i)).join('');
  openSet.forEach(id => {
    const b = document.getElementById('p'+id);
    if (b) b.classList.add('open');
  });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderProject(p, idx) {
  const tasks = p.tasks || [];
  return `<div class="project-block" id="p${p.id}">
    <div class="project-header" onclick="toggleProj(${p.id})">
      <div class="chevron"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,2 10,7 4,12"/></svg></div>
      <span class="project-name">${esc(p.name)}</span>
      ${tasks.length ? `<span class="project-count">${tasks.length}</span>` : ''}
      <div class="proj-actions" onclick="event.stopPropagation()">
        ${idx > 0 ? `<button class="proj-btn" onclick="moveProj(${p.id},'up')" title="Вверх"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="2,9 7,4 12,9"/></svg></button>` : ''}
        ${idx < projects.length-1 ? `<button class="proj-btn" onclick="moveProj(${p.id},'down')" title="Вниз"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="2,5 7,10 12,5"/></svg></button>` : ''}
        <button class="proj-btn del" onclick="delProj(${p.id})" title="Удалить"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,3 13,3"/><path d="M4,3V2h6v1"/><path d="M2,3l1,9h8l1-9"/></svg></button>
      </div>
    </div>
    <div class="tasks-list">
      ${tasks.map(t => `
        <div class="task-item" data-status="${t.status}" onclick="openStatus(${t.id},'${t.status}')">
          <div class="dot ${t.status}"></div>
          <span class="task-title">${esc(t.title)}</span>
          <button class="task-del" onclick="event.stopPropagation();delTask(${t.id})" aria-label="Удалить">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/></svg>
          </button>
        </div>`).join('')}
      <div class="add-task-row" onclick="openTaskSheet(${p.id})">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="7" y1="1" x2="7" y2="13"/><line x1="1" y1="7" x2="13" y2="7"/></svg>
        Добавить задачу
      </div>
    </div>
  </div>`;
}

// ─── Project actions ───
function toggleProj(id) {
  openSet.has(id) ? openSet.delete(id) : openSet.add(id);
  document.getElementById('p'+id)?.classList.toggle('open');
}

function openProjSheet() {
  document.getElementById('projInput').value = '';
  document.getElementById('projSheet').classList.add('on');
  setTimeout(() => document.getElementById('projInput').focus(), 280);
}

function submitProj() {
  const name = document.getElementById('projInput').value.trim();
  if (!name) return;
  closeSheet('projSheet');
  const id = nextProjId++;
  projects.push({ id, name, tasks: [] });
  openSet.add(id);
  save();
  render();
  tg?.HapticFeedback?.impactOccurred('light');
}

function delProj(id) {
  const p = projects.find(x => x.id === id);
  const n = p?.tasks?.length || 0;
  const msg = n > 0
    ? `Удалить «${p.name}» и ${n} задач?`
    : `Удалить «${p?.name}»?`;
  if (!confirm(msg)) return;
  projects = projects.filter(x => x.id !== id);
  openSet.delete(id);
  save();
  render();
  tg?.HapticFeedback?.impactOccurred('medium');
}

function moveProj(id, dir) {
  const i = projects.findIndex(x => x.id === id);
  if (i < 0) return;
  const j = dir === 'up' ? i - 1 : i + 1;
  if (j < 0 || j >= projects.length) return;
  [projects[i], projects[j]] = [projects[j], projects[i]];
  save();
  render();
  tg?.HapticFeedback?.selectionChanged?.();
}

// ─── Task actions ───
function openTaskSheet(projId) {
  activeProjId = projId;
  document.getElementById('taskInput').value = '';
  document.getElementById('taskSheet').classList.add('on');
  setTimeout(() => document.getElementById('taskInput').focus(), 280);
}

function submitTask() {
  const title = document.getElementById('taskInput').value.trim();
  if (!title) return;
  closeSheet('taskSheet');
  const proj = projects.find(p => p.id === activeProjId);
  if (!proj) return;
  proj.tasks = proj.tasks || [];
  proj.tasks.push({ id: nextTaskId++, title, status: 'todo' });
  save();
  render();
  tg?.HapticFeedback?.impactOccurred('light');
}

function openStatus(taskId, current) {
  activeTaskId = taskId;
  document.getElementById('statusSheet').classList.add('on');
  document.querySelectorAll('.status-opt').forEach(b => {
    b.classList.toggle('sel', b.dataset.s === current);
  });
}

function applyStatus(status) {
  closeSheet('statusSheet');
  projects.forEach(p => {
    const t = p.tasks?.find(t => t.id === activeTaskId);
    if (t) t.status = status;
  });
  save();
  render();
  tg?.HapticFeedback?.impactOccurred('light');
}

function delTask(taskId) {
  projects.forEach(p => {
    if (p.tasks) p.tasks = p.tasks.filter(t => t.id !== taskId);
  });
  save();
  render();
  tg?.HapticFeedback?.impactOccurred('medium');
}

// ─── Sheet helpers ───
function closeSheet(id) { document.getElementById(id).classList.remove('on'); }
function bgClose(e, id) { if (e.target.id === id) closeSheet(id); }

document.getElementById('projInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitProj(); });
document.getElementById('taskInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitTask(); });

// ─── Init ───
loadData(() => render());
</script>
</body>
</html>
